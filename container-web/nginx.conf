types {
    text/html                             html htm shtml;
    text/css                              css;
    application/javascript                js mjs;
    application/wasm                      wasm;
    image/svg+xml                         svg svgz;
    image/png                             png;
    image/jpeg                            jpeg jpg;
    application/json                      json;
}

server {
    listen 8080 default_server;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/wasm
        image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /craft {
        return 301 /craft/;
    }

    location /craft/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location = /pl {
        return 301 /pl/;
    }

    location /pl/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
